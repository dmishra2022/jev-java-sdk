name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      # Unit + integration tests, 100% JaCoCo gate on every counter, sample app tests.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      # Proves the release artifacts (sources, javadoc) build; signing and upload only happen in release.yml.
      - name: Release dry run
        run: ./mvnw -B -ntp -Prelease -Dgpg.skip -DskipTests verify

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '*/target/site/jacoco/'
